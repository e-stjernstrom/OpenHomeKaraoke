<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OpenHomeKaraoke">
  <title>OpenHomeKaraoke</title>
  <!-- OpenHomeKaraoke logo A, small-size variant (favicon, home-screen icon, 16-64 px).
       Same parts as logo-a.svg, from Material Icons "home" and "mic" (Apache License 2.0,
       https://github.com/google/material-design-icons). The music notes are dropped and the ring
       and house are thicker and larger so the shape survives at 16 px. -->
  <defs>
    <linearGradient id="ohk-ring-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d062"/>
      <stop offset="0.5" stop-color="#1abc9c"/>
      <stop offset="1" stop-color="#e040a0"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="#1d2f42"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#ohk-ring-s)" stroke-width="44"/>
  <!-- home silhouette, 24 -> 336 px -->
  <g transform="translate(88 70) scale(14)">
    <path d="M12 3 2 12h3v8h14v-8h3z" fill="#a5b5c5"/>
  </g>
  <!-- mic, 24 -> 156 px -->
  <g transform="translate(178 196) scale(6.5)">
    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z" fill="#1d2f42"/>
  </g>
</svg>
