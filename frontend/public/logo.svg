<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OpenHomeKaraoke">
  <title>OpenHomeKaraoke</title>
  <!-- OpenHomeKaraoke logo A (final, 2026-11-14). Built from Material Icons "home", "mic" and
       "music_note" by Google (Apache License 2.0, https://github.com/google/material-design-icons),
       combined, scaled and recoloured. The house is the "home" outline without its door, so the
       microphone reads on a solid wall. Colours from the OHK MD2 palette (ui-review/md2-palette.json);
       the magenta end of the ring echoes the original neon logo. Transparent outside the circle. -->
  <defs>
    <linearGradient id="ohk-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d062"/>
      <stop offset="0.5" stop-color="#1abc9c"/>
      <stop offset="1" stop-color="#e040a0"/>
    </linearGradient>
    <radialGradient id="ohk-bg" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2b4663"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#ohk-bg)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ohk-ring)" stroke-width="22"/>
  <!-- home (Material Icons) silhouette without the door, 24 -> 300 px, primary 200 -->
  <g transform="translate(106 96) scale(12.5)">
    <path d="M12 3 2 12h3v8h14v-8h3z" fill="#a5b5c5"/>
  </g>
  <!-- mic (Material Icons), centred on the wall, primary 900 -->
  <g transform="translate(190 204) scale(5.5)">
    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z" fill="#1d2f42"/>
  </g>
  <!-- music_note (Material Icons): teal on the right, amber on the left, both inside the ring -->
  <g transform="translate(318 92) scale(4)">
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="#1abc9c"/>
  </g>
  <g transform="translate(112 96) scale(3.2)">
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="#f6d062"/>
  </g>
</svg>
