<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHomeKaraoke</title>
<link rel="icon" type="image/svg+xml" href="/static/app/icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: rgba(255,255,255,.87);
    font-family: Roboto, "Noto Sans", "Noto Sans CJK SC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100vh; padding: 24px; box-sizing: border-box; }
  .next { align-self: flex-end; text-align: right; font-size: 2rem; min-height: 5.5rem; }
  .next .label { font-size: 1rem; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .next .title { color: #f6d062; font-weight: 500; }
  .next .user { font-size: 1.25rem; color: rgba(255,255,255,.6); }
  .logo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .logo img { width: min(40vh, 60vw); height: auto; }
  .logo .name { font-size: 2.5rem; font-weight: 500; }
  .join { display: flex; align-items: center; gap: 16px; font-size: 1.5rem; }
  .join img { width: 120px; height: 120px; image-rendering: pixelated; background: #fff; padding: 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="next" id="next"></div>
  <div class="logo">
    <img src="/static/app/logo.svg" alt="OpenHomeKaraoke">
    <div class="name">OpenHomeKaraoke</div>
  </div>
  <div class="join">
    <img src="/qrcode" alt="QR code">
    <span>{{ url }}</span>
  </div>
</div>
<script>
  const next = document.getElementById('next');
  function show(obj) {
    next.textContent = '';
    if (!obj || !obj.up_next) return;
    const label = document.createElement('div'); label.className = 'label'; label.textContent = 'Up next';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = obj.up_next;
    const user = document.createElement('div'); user.className = 'user'; user.textContent = obj.next_user || '';
    next.append(label, title, user);
  }
  async function poll() {
    try {
      const r = await fetch('/nowplaying');
      const text = await r.text();
      show(text ? JSON.parse(text) : null);
    } catch (e) { /* server restarting */ }
  }
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
